<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toppage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 min-h-screen">

    <header class="sticky top-0 left-0 z-50 bg-white pr-4">
            <div class="flex justify-between">
                <img src="../img\okinawa.png" alt="oki" class="w-24">
                <p class="text-2xl font-serif m-4">那覇国際高校</p>
                <div class="text-2xl flex items-center">
                    <nav class="flex gap-10">
                        <a href="#ホーム" class="transition hover:opacity-80">ホーム</a>
                        <a href="#教育理念" class="transition hover:opacity-80">教育理念</a>
                    </nav>
                </div>
            </div>
    </header>

    <div class="mb-20">
        <img src="../img\nahakokusaikoukou.jpg" alt="nahakoikusai" class="w-full">
    </div>

    <div>
        <section id="教育理念">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-3xl">
                    <img src="../img\taiku.jpg" alt="taikusai" class="rounded-t-3xl w-full">
                    <p class="text-3xl font-bold text-center m-2">自主</p>
                </div>
                <div class="bg-white rounded-3xl shadow">
                    <img src="../img\bunkasaino.jpg" alt="kousyou" class="rounded-t-3xl w-full">
                    <p class="text-3xl font-bold text-center m-2">敬愛</p>
                </div>
                <div class="bg-white rounded-3xl shadow">
                    <img src="../img\ryugaku.jpg" alt="dancebu" class="rounded-t-3xl w-full">
                    <p class="text-3xl font-bold text-center m-2">飛躍</p>
                </div>
            </div>

        </section>
    </div>
    
    <footer class="bg-white m-4">
        <p class="text-center text-3xl font-serif p-2">那覇国際高校</p>
    </footer>

</body>
</html>
